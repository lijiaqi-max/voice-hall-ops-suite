name: ci

on:
  push:
  pull_request:

jobs:
  api-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web-admin/pnpm-lock.yaml
      - name: Test API
        working-directory: services/api
        run: |
          chmod +x gradlew
          ./gradlew test buildFatJar --no-daemon
      - name: Test and build admin
        working-directory: web-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [member-android, control-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint, compile instrumentation and build debug APK
        working-directory: apps/${{ matrix.app }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:compileDebugAndroidTestKotlin :app:assembleDebug --no-daemon
      - name: Check Android permission boundary
        working-directory: apps/${{ matrix.app }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | tee manifest.txt
          if [ "${{ matrix.app }}" = "member-android" ] && grep "BIND_ACCESSIBILITY_SERVICE" manifest.txt; then
            echo "member app must not declare an accessibility service"
            exit 1
          fi
          if [ "${{ matrix.app }}" = "control-android" ] && ! grep "BIND_ACCESSIBILITY_SERVICE" manifest.txt; then
            echo "control app must declare the accessibility service"
            exit 1
          fi

  source-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source package whitelist
        shell: pwsh
        run: .\scripts\package-source.ps1
